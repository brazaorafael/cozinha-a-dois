name: Gerar cardápio e enviar e-mail

on:
  schedule:
    - cron: "0 11 * * *"    # 08:00 em São Paulo
    - cron: "30 22 * * 0"   # domingo, 19:30 em São Paulo
  workflow_dispatch:
    inputs:
      mode:
        description: "O que gerar?"
        type: choice
        default: diario
        options:
          - diario
          - semanal

permissions:
  contents: write

concurrency:
  group: cozinha-dados
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar, validar e enviar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY || secrets.PEXELS_API_KEY }}
          ENABLE_PEXELS_FALLBACK: ${{ vars.ENABLE_PEXELS_FALLBACK || 'true' }}
          APP_URL: ${{ vars.APP_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          AGENT_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 22 * * 0' && 'semanal' || 'diario') }}
        run: python refeicoes_agent.py

      - name: Publicar os dados novos
        env:
          AGENT_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 22 * * 0' && 'semanal' || 'diario') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nenhum dado mudou."
          else
            git commit -m "Atualiza cardápio (${AGENT_MODE})"
            git push
          fi
